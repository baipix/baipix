<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale stops iOS from zooming the page when a text field is focused (our fields are
         under 16px); pinch zoom still works there, and the canvas has its own zoom. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="The Baipix editor: draw and animate pixel art in your browser, for free, with layers, palettes and isometric tools, then export SVG, PNG, GIF or Aseprite."
    />
    <title>Baipix editor · Draw and animate pixel art in your browser</title>
    <!-- The editor is served at baipix.app/app/; its share card is the site's. Its title leaves
         "free online pixel art editor" to the home page, so the two don't compete in search. -->
    <link rel="canonical" href="https://baipix.app/app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Baipix" />
    <meta property="og:url" content="https://baipix.app/app/" />
    <meta property="og:title" content="Baipix editor · Draw and animate pixel art in your browser" />
    <meta
      property="og:description"
      content="Draw and animate pixel art in your browser, for free, then export SVG, PNG, GIF or Aseprite."
    />
    <meta property="og:image" content="https://baipix.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><style>path{fill:%23000}@media (prefers-color-scheme:dark){path{fill:%23fff}}</style><path d='M0 2h3v6H0zM3 5h3v3H3zM5 0h3v3H5z'/></svg>"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Seen without JavaScript, and by search engines that don't run it. -->
    <noscript>
      <main
        style="
          max-width: 36rem;
          margin: 3rem auto;
          padding: 0 1rem;
          font:
            16px/1.5 system-ui,
            sans-serif;
        "
      >
        <h1>Baipix editor</h1>
        <p>
          Baipix is a free pixel art editor that runs in your browser. Draw with the pencil, fills, shapes and
          selections, work in layers and boards, animate frame by frame, and draw isometric pixel art. Your
          files stay on your device.
        </p>
        <p>Export to SVG, PNG, GIF, sprite sheets or Aseprite, or as code for a website.</p>
        <p>The editor needs JavaScript. Turn it on to start drawing.</p>
        <p><a href="https://baipix.app/">Home</a> · <a href="https://baipix.app/docs/">Docs</a></p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
