<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale stops iOS from zooming the page when a text field is focused (our fields are
         under 16px); pinch zoom still works there, and the canvas has its own zoom. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="The Baipix editor: draw pixel art in your browser, for free, with layers, palettes and symmetry, then export clean SVG or PNG for Figma."
    />
    <title>Baipix editor · Free online pixel art editor</title>
    <!-- The editor is served at baipix.app/app/; its share card is the site's. -->
    <link rel="canonical" href="https://baipix.app/app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Baipix" />
    <meta property="og:url" content="https://baipix.app/app/" />
    <meta property="og:title" content="Baipix editor · Free online pixel art editor" />
    <meta
      property="og:description"
      content="Draw pixel art in your browser, for free, then export clean SVG or PNG for Figma."
    />
    <meta property="og:image" content="https://baipix.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><style>path{fill:%23000}@media (prefers-color-scheme:dark){path{fill:%23fff}}</style><path d='M0 2h3v6H0zM3 5h3v3H3zM5 0h3v3H5z'/></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
