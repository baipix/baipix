<!doctype html>
<!-- The 0.8 post's languages picture, rendered by blog-shots.mjs at 1100 × 688: the editor's six
     languages, each written in itself, set at different sizes; the two new ones in violet. ?dark for
     the dark one. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Silkscreen&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --card: #f3f0e9;
        --text: #1d1b18;
        --muted: #a49d90;
        --new: #6e56cf;
      }
      .dark {
        --card: #1d1b18;
        --text: #f2f0eb;
        --muted: #6f695f;
        --new: #9d8af0;
      }
      html,
      body {
        margin: 0;
        width: 1100px;
        height: 688px;
        background: var(--card);
        color: var(--text);
        font-family: 'Geist', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
        overflow: hidden;
      }
      span {
        position: absolute;
        line-height: 1;
        letter-spacing: -0.04em;
        white-space: nowrap;
      }
      .new {
        color: var(--new);
      }
      .pixel {
        font-family: 'Silkscreen', monospace;
        letter-spacing: 0;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <span class="new" style="left: 92px; top: 92px; font-size: 168px; font-weight: 600">日本語</span>
    <span style="left: 640px; top: 120px; font-size: 64px; font-weight: 500">Français</span>
    <span class="new" style="left: 470px; top: 268px; font-size: 132px; font-weight: 600">Italiano</span>
    <span style="left: 96px; top: 336px; font-size: 52px; font-weight: 500">Español</span>
    <span style="left: 150px; top: 492px; font-size: 76px; font-weight: 500">Українська</span>
    <span class="pixel" style="left: 760px; top: 520px; font-size: 32px; color: var(--muted)">English</span>
    <script>
      if (location.search.includes('dark')) document.documentElement.classList.add('dark');
    </script>
  </body>
</html>
